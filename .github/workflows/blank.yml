name: 构建 DeepSeek Harness 桌面端（每日检测官方Tag版本）

on:
  # UTC 0点，北京时间早上8点每日检测；想要北京时间0点则改为 cron: '0 16 * * *'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 手动构建指定版本标签/分支/提交哈希，留空自动拉最新dsh-v开头Tag
        default: ''
        type: string

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  RECORD_FILE: .last-dsh-version-tag

jobs:
  check_upstream:
    name: 检测上游最新Tag
    runs-on: ubuntu-latest
    outputs:
      has_new_version: ${{ steps.compare.outputs.has_new_version }}
      latest_tag: ${{ steps.get_latest_tag.outputs.latest_tag }}
    steps:
      - name: 检出本仓库（读取上次记录版本）
        uses: actions/checkout@v4

      - name: 获取官方仓库所有dsh-v开头Tag，取最新版本
        id: get_latest_tag
        shell: bash
        run: |
          set +eo pipefail
          # 使用内置GITHUB_TOKEN认证调用API，提升访问限额，防限流403
          RESP=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/tags")
          # 提取所有tag名称，筛选 dsh-v 开头
          ALL_TAGS=$(echo "$RESP" | jq -r '.[].name' || true)
          V_TAGS=$(echo "$ALL_TAGS" | grep "^dsh-v" || true)
          if [ -z "$V_TAGS" ]; then
            LATEST_TAG=""
          else
            LATEST_TAG=$(echo "$V_TAGS" | sort -V | tail -n1)
          fi
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "上游最新版本标签: $LATEST_TAG"

      - name: 读取上次记录的版本标签
        id: read_last
        run: |
          if [ -f ${{ env.RECORD_FILE }} ]; then
            LAST_TAG=$(cat ${{ env.RECORD_FILE }})
          else
            LAST_TAG="none"
          fi
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "上次构建的版本标签: $LAST_TAG"

      - name: 对比版本标签
        id: compare
        run: |
          UPSTREAM_TAG=${{ steps.get_latest_tag.outputs.latest_tag }}
          LAST_SAVED_TAG=${{ steps.read_last.outputs.last_tag }}
          # 空tag代表获取失败，不触发打包
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "has_new_version=false" >> $GITHUB_OUTPUT
            echo "⏸️ 获取上游Tag失败，跳过本次构建"
          elif [ "$UPSTREAM_TAG" != "$LAST_SAVED_TAG" ]; then
            echo "has_new_version=true" >> $GITHUB_OUTPUT
            echo "✅ 发现新版本Tag $UPSTREAM_TAG，准备打包"
          else
            echo "has_new_version=false" >> $GITHUB_OUTPUT
            echo "⏸️ 上游没有新增Tag，直接终止流程"
          fi

  build:
    name: ${{ matrix.platform }}
    needs: check_upstream
    if: needs.check_upstream.outputs.has_new_version == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - macos-14

    steps:
      - name: 检出上游源码（对应最新Tag）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          # 手动输入优先，否则自动使用检测到的最新tag
          ref: ${{ github.event.inputs.ref || needs.check_upstream.outputs.latest_tag }}
          fetch-depth: 0

      - name: 安装 Node.js 22.19.0（移除cache配置）
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          # ===== 删除了cache和cache-dependency-path，不再做缓存，消除报错 =====

      - name: 安装项目依赖
        working-directory: ./apps/desktop
        run: npm ci

      # 【可选】注释掉单元测试，防止测试失败打断打包，取消下面注释#即可启用
      # - name: 执行单元测试
      #   working-directory: ./apps/desktop
      #   run: npm test

      - name: 构建并打包 Electron 程序
        working-directory: ./apps/desktop
        run: npm run dist -- --publish never

      - name: 校验打包产物完整性
        working-directory: ./apps/desktop
        run: npm run verify:packaged

      - name: 上传打包产物作为制品
        uses: actions/upload-artifact@v4
        with:
          name: dsh桌面-${{ matrix.platform }}-${{ needs.check_upstream.outputs.latest_tag }}
          path: apps/desktop/dist/
          retention-days: 30

  release:
    name: 创建 GitHub 发布版
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有平台打包制品
        uses: actions/download-artifact@v4

      - name: 创建发布并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          name: DeepSeek Harness 桌面构建 ${{ needs.check_upstream.outputs.latest_tag }}
          body: >
            自动构建，来源官方Tag版本：${{ needs.check_upstream.outputs.latest_tag }}
            https://github.com/deepseek-ai/deepseek-harness/tree/${{ needs.check_upstream.outputs.latest_tag }}
          generate_release_notes: false

      - name: 更新版本标签记录文件
        run: |
          echo ${{ needs.check_upstream.outputs.latest_tag }} > ${{ env.RECORD_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交并推送版本记录变更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.RECORD_FILE }}
          git commit -m "更新记录版本标签：${{ needs.check_upstream.outputs.latest_tag }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
