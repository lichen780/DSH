name: 构建 DeepSeek Harness 桌面端（每日检测上游默认分支）

on:
  # UTC 0点，北京时间早上8点每日检测一次；想要北京时间0点则改为 cron: '0 16 * * *'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 手动构建时指定分支/提交哈希/标签，留空使用上游默认分支
        default: ''
        type: string

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  SHA_FILE: .last-upstream-sha

jobs:
  check_upstream:
    name: 检测上游提交与默认分支
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      latest_sha: ${{ steps.get_info.outputs.latest_sha }}
      default_branch: ${{ steps.get_info.outputs.default_branch }}
    steps:
      - name: 检出本仓库（读取上次保存的提交哈希）
        uses: actions/checkout@v4

      - name: 获取上游仓库信息（默认分支 + 最新提交哈希）
        id: get_info
        run: |
          curl -s -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}" > repo.json
          DEFAULT_BRANCH=$(jq -r '.default_branch' repo.json)
          LATEST_SHA=$(jq -r '.branches["'$DEFAULT_BRANCH'"].commit.sha' repo.json)
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          echo "上游默认分支: $DEFAULT_BRANCH"
          echo "最新提交哈希: $LATEST_SHA"

      - name: 读取上次记录的哈希
        id: read_last
        run: |
          if [ -f ${{ env.SHA_FILE }} ]; then
            LAST_SHA=$(cat ${{ env.SHA_FILE }})
          else
            LAST_SHA="none"
          fi
          echo "last_sha=$LAST_SHA" >> $GITHUB_OUTPUT
          echo "已保存的上次哈希: $LAST_SHA"

      - name: 对比提交哈希
        id: compare
        run: |
          UPSTREAM_SHA=${{ steps.get_info.outputs.latest_sha }}
          LAST_SAVED_SHA=${{ steps.read_last.outputs.last_sha }}
          if [ "$UPSTREAM_SHA" != "$LAST_SAVED_SHA" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 上游仓库存在更新，准备开始打包"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏸️ 上游无任何更新，直接终止流程"
          fi

  build:
    name: ${{ matrix.platform }}
    needs: check_upstream
    if: needs.check_upstream.outputs.changed == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - macos-14
          - macos-13

    steps:
      - name: 检出上游源码
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # 手动输入引用优先，否则使用上游默认分支
          ref: ${{ github.event.inputs.ref || needs.check_upstream.outputs.default_branch }}
          fetch-depth: 0

      - name: 设置国内 NPM 镜像加速
        working-directory: ./apps/desktop
        run: npm config set registry https://registry.npmmirror.com

      - name: 安装 Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装项目依赖
        working-directory: ./apps/desktop
        run: npm ci

      - name: 执行单元测试
        working-directory: ./apps/desktop
        run: npm test

      - name: 构建并打包 Electron 程序
        working-directory: ./apps/desktop
        run: npm run dist -- --publish never

      - name: 校验打包产物完整性
        working-directory: ./apps/desktop
        run: npm run verify:packaged

      - name: 上传打包产物作为制品
        uses: actions/upload-artifact@v4
        with:
          name: dsh桌面-${{ matrix.platform }}-${{ needs.check_upstream.outputs.latest_sha }}
          path: apps/desktop/dist/
          retention-days: 30

  release:
    name: 创建 GitHub 发布版
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有平台打包制品
        uses: actions/download-artifact@v4

      - name: 创建发布并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          name: DeepSeek Harness 桌面构建 ${{ needs.check_upstream.outputs.latest_sha }}
          body: >
            自动构建，来源上游默认分支提交：
            https://github.com/deepseek-ai/deepseek-harness/commit/${{ needs.check_upstream.outputs.latest_sha }}
          generate_release_notes: false

      - name: 更新上游最新提交哈希记录文件
        run: |
          echo ${{ needs.check_upstream.outputs.latest_sha }} > ${{ env.SHA_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交并推送哈希记录变更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.SHA_FILE }}
          git commit -m "更新上游记录哈希：${{ needs.check_upstream.outputs.latest_sha }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
