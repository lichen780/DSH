name: 构建 DeepSeek Harness 桌面端（每日检测上游默认分支）

on:
  # UTC 0点，北京时间早上8点每日检测一次；想要北京时间0点则改为 cron: '0 16 * * *'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      引用:
        description: 手动构建时指定分支/提交哈希/标签，留空使用上游默认分支
        default: ''
        type: string

env:
  上游仓库: deepseek-ai/deepseek-harness
  记录文件: .last-upstream-sha

jobs:
  检测上游:
    name: 检测上游提交与默认分支
    runs-on: ubuntu-latest
    outputs:
      有更新: ${{ steps.对比.outputs.有更新 }}
      最新哈希: ${{ steps.获取信息.outputs.最新哈希 }}
      默认分支: ${{ steps.获取信息.outputs.默认分支 }}
    steps:
      - name: 检出本仓库（读取上次保存的提交哈希）
        uses: actions/checkout@v4

      - name: 获取上游仓库信息（默认分支 + 最新提交哈希）
        id: 获取信息
        run: |
          curl -s -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ env.上游仓库 }}" > repo.json
          默认分支=$(jq -r '.default_branch' repo.json)
          最新哈希=$(jq -r '.branches["'$默认分支'"].commit.sha' repo.json)
          echo "默认分支=$默认分支" >> $GITHUB_OUTPUT
          echo "最新哈希=$最新哈希" >> $GITHUB_OUTPUT
          echo "上游默认分支: $默认分支"
          echo "最新提交哈希: $最新哈希"

      - name: 读取上次记录的哈希
        id: 读取记录
        run: |
          if [ -f ${{ env.记录文件 }} ]; then
            上次哈希=$(cat ${{ env.记录文件 }})
          else
            上次哈希="none"
          fi
          echo "上次哈希=$上次哈希" >> $GITHUB_OUTPUT
          echo "已保存的上次哈希: $上次哈希"

      - name: 对比提交哈希
        id: 对比
        run: |
          上游最新哈希=${{ steps.获取信息.outputs.最新哈希 }}
          上次保存哈希=${{ steps.读取记录.outputs.上次哈希 }}
          if [ "$上游最新哈希" != "$上次保存哈希" ]; then
            echo "有更新=true" >> $GITHUB_OUTPUT
            echo "✅ 上游仓库存在更新，准备开始打包"
          else
            echo "有更新=false" >> $GITHUB_OUTPUT
            echo "⏸️ 上游无任何更新，直接终止流程"
          fi

  打包:
    name: ${{ matrix.平台 }}
    needs: 检测上游
    if: needs.检测上游.outputs.有更新 == 'true'
    runs-on: ${{ matrix.平台 }}
    strategy:
      fail-fast: false
      matrix:
        平台:
          - windows-latest
          - macos-14
          - macos-13

    steps:
      - name: 检出上游源码
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # 手动输入引用优先，否则使用上游默认分支
          ref: ${{ github.event.inputs.引用 || needs.检测上游.outputs.默认分支 }}
          fetch-depth: 0

      - name: 设置国内 NPM 镜像加速
        working-directory: ./apps/desktop
        run: npm config set registry https://registry.npmmirror.com

      - name: 安装 Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装项目依赖
        working-directory: ./apps/desktop
        run: npm ci

      - name: 执行单元测试
        working-directory: ./apps/desktop
        run: npm test

      - name: 构建并打包 Electron 程序
        working-directory: ./apps/desktop
        run: npm run dist -- --publish never

      - name: 校验打包产物完整性
        working-directory: ./apps/desktop
        run: npm run verify:packaged

      - name: 上传打包产物作为制品
        uses: actions/upload-artifact@v4
        with:
          name: dsh桌面-${{ matrix.平台 }}-${{ needs.检测上游.outputs.最新哈希 }}
          path: apps/desktop/dist/
          retention-days: 30

  发布版本:
    name: 创建 GitHub 发布版
    needs: 打包
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有平台打包制品
        uses: actions/download-artifact@v4

      - name: 创建发布并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          name: DeepSeek Harness 桌面构建 ${{ needs.检测上游.outputs.最新哈希 }}
          body: >
            自动构建，来源上游默认分支提交：
            https://github.com/deepseek-ai/deepseek-harness/commit/${{ needs.检测上游.outputs.最新哈希 }}
          generate_release_notes: false

      - name: 更新上游最新提交哈希记录文件
        run: |
          echo ${{ needs.检测上游.outputs.最新哈希 }} > ${{ env.记录文件 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交并推送哈希记录变更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.记录文件 }}
          git commit -m "更新上游记录哈希：${{ needs.检测上游.outputs.最新哈希 }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
